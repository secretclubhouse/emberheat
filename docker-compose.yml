version: '3.8'

services:
  # Redis for state persistence
  redis:
    image: redis:7-alpine
    container_name: thermostat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - thermostat-network

  # Thermostat application
  thermostat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermostat-app
    restart: unless-stopped
    privileged: true  # Required for GPIO access
    network_mode: host  # Required for Matter mDNS and GPIO
    devices:
      - "/dev/gpiomem:/dev/gpiomem"  # GPIO device access
      - "/sys/bus/w1/devices:/sys/bus/w1/devices:ro"  # 1-Wire sensors (read-only)
    volumes:
      - ./config:/app/config:ro
      - /sys/class/gpio:/sys/class/gpio  # GPIO sysfs
    environment:
      - RUST_LOG=info
      - REDIS_URL=redis://localhost:6379
    depends_on:
      - redis

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: thermostat-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - thermostat-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: thermostat-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    networks:
      - thermostat-network
    depends_on:
      - prometheus

networks:
  thermostat-network:
    driver: bridge

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
