[package]
name = "emberheat-matter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Matter Thermostat Cluster implementation for heating-only thermostats"

[dependencies]
# Matter protocol
# Using sysgrok fork which is updated for Embassy 0.5+ compatibility
# This must match the fork used by rs-matter-embassy to avoid trait conflicts
rs-matter = { git = "https://github.com/sysgrok/rs-matter", branch = "next", default-features = false, features = ["rustcrypto"] }

# Embassy async (for Signal, select, etc.)
embassy-futures = "0.1"
embassy-sync = "0.7"

# Utilities
log = { workspace = true }
heapless = "0.9"

[features]
default = []
std = []

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "macros", "sync", "time"] }
