[package]
name = "emberheat-matter"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Matter Thermostat Cluster implementation for heating-only thermostats"

[dependencies]
# Matter protocol
# Must be the same rs-matter version that rs-matter-embassy uses, to avoid trait conflicts
rs-matter = { version = "0.4", default-features = false, features = ["rustcrypto"] }

# Embassy async (for Signal, select, etc.)
embassy-futures = "0.1"
embassy-sync = "0.8"

# Utilities
log = { workspace = true }
heapless = "0.9"

[features]
default = []
std = []

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "macros", "sync", "time"] }
