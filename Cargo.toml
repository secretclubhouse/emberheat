[workspace]
members = [
    "thermos-core",
    "thermos-linux",
    "thermos-esp32",
]
resolver = "2"

[workspace.dependencies]
# Shared Embassy dependencies for all crates
# Using 0.2 versions to match esp-rtos requirements
embassy-executor = "0.6"
embassy-time = "0.3"
embassy-sync = "0.6"
embassy-futures = "0.1"

# Shared serialization
# Must disable default 'std' feature for no_std compatibility
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Shared error handling
thiserror = "2.0"
anyhow = "1.0"

# Shared logging
tracing = "0.1"
log = "0.4"

# Shared async utilities
async-trait = "0.1"
futures = "0.3"

# Time utilities
chrono = "0.4"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(matter_enabled)'] }
