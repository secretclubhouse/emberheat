[workspace]
members = [
    "emberheat-core",
    "emberheat-matter",
    "emberheat-linux",
    "emberheat-esp32",
]
# Default to ESP32 development - emberheat-linux is kept but not actively developed
default-members = [
    "emberheat-core",
    "emberheat-matter",
    "emberheat-esp32",
]
resolver = "2"

[workspace.dependencies]
# Shared Embassy dependencies for all crates
# Using 0.2 versions to match esp-rtos requirements
embassy-executor = "0.6"
embassy-time = "0.3"
embassy-sync = "0.6"
embassy-futures = "0.1"

# Shared serialization
# Must disable default 'std' feature for no_std compatibility
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }

# Shared error handling
thiserror = "2.0"
anyhow = "1.0"

# Shared logging
tracing = "0.1"
log = "0.4"

# Shared async utilities
async-trait = "0.1"
futures = "0.3"

# Time utilities
chrono = "0.4"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(matter_enabled)'] }

# Patch crates.io dependencies to use sysgrok forks with Embassy 0.5+ support
# These forks have been updated for embassy-time 0.5 compatibility
[patch.crates-io]
rs-matter = { git = "https://github.com/sysgrok/rs-matter", branch = "next" }
rs-matter-stack = { git = "https://github.com/sysgrok/rs-matter-stack", branch = "next" }
openthread = { git = "https://github.com/sysgrok/openthread", branch = "next" }
# Note: rs-matter-embassy uses secretclubhouse/rs-matter-embassy fork (stack-public branch)
# in emberheat-esp32/Cargo.toml to expose EnetNetif.stack for MQTT TCP support with Matter
