[package]
name = "thermos-rust"
version = "0.1.0"
edition = "2021"
authors = ["Thermos Contributors"]
description = "Multi-zone HomeKit thermostat system using Matter protocol"
license = "MIT"
repository = "https://github.com/josht/thermos-rust"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("bindgen"))'] }

[dependencies]
# Async runtime
tokio = { version = "1.48", features = ["full"] }
futures = "0.3"

# Matter protocol integration via Connected Home IP C library
# The actual library is in third_party/connectedhomeip (git submodule)
# FFI bindings are compiled via build.rs

# Async trait support
async-trait = "0.1"

# Lazy static for global metrics
lazy_static = "1.5"

# Configuration and serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Redis client
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Prometheus metrics
prometheus = { version = "0.14", features = ["process"] }

# HTTP client for extra sensors
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Signal handling
tokio-util = "0.7"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Platform-specific dependencies
[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"  # Raspberry Pi GPIO library (Linux only)

[build-dependencies]
# Build script dependencies for compiling Matter C wrapper
cc = "1.0"
# Optional: bindgen for auto-generating FFI bindings
# Enable with: cargo build --features bindgen
# bindgen = { version = "0.69", optional = true }

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tempfile = "3.14"
pretty_assertions = "1.4"

[features]
# Optional feature to regenerate FFI bindings
# bindgen = ["dep:bindgen"]
default = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
