name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write
  packages: write

jobs:
  # Build binaries for different Linux targets using cross-compilation
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi 2/3/4 (32-bit)
          - target: armv7-unknown-linux-gnueabihf
            cross: true

          # Raspberry Pi 3/4 (64-bit)
          - target: aarch64-unknown-linux-gnu
            cross: true

          # x86_64 Linux (for testing/development)
          - target: x86_64-unknown-linux-gnu
            cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-release-

      - name: Build release binary (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }} -p emberheat-linux

      - name: Build release binary (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p emberheat-linux

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/emberheat-linux || true

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf emberheat-linux-${{ matrix.target }}.tar.gz emberheat-linux
          sha256sum emberheat-linux-${{ matrix.target }}.tar.gz > emberheat-linux-${{ matrix.target }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emberheat-linux-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/emberheat-linux-${{ matrix.target }}.tar.gz
            target/${{ matrix.target }}/release/emberheat-linux-${{ matrix.target }}.tar.gz.sha256

  # Create GitHub release with all artifacts
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.sha256" \) -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: release-assets/*
          body: |
            ## EmberHeat ${{ steps.version.outputs.version }}

            Multi-zone thermostat system for Raspberry Pi.

            ### Installation

            Download the appropriate binary for your Raspberry Pi model:
            - **Raspberry Pi 2/3/4 (32-bit)**: `emberheat-linux-armv7-unknown-linux-gnueabihf.tar.gz`
            - **Raspberry Pi 3/4 (64-bit)**: `emberheat-linux-aarch64-unknown-linux-gnu.tar.gz`
            - **x86_64 Linux**: `emberheat-linux-x86_64-unknown-linux-gnu.tar.gz`

            ### Quick Start

            ```bash
            # Download and extract (example for 64-bit Pi)
            wget https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.version }}/emberheat-linux-aarch64-unknown-linux-gnu.tar.gz
            tar xzf emberheat-linux-aarch64-unknown-linux-gnu.tar.gz

            # Make executable and install
            chmod +x emberheat-linux
            sudo mv emberheat-linux /usr/local/bin/

            # Run
            emberheat-linux --config /path/to/config.json
            ```

            ### Changes

            See [CHANGELOG.md](CHANGELOG.md) for details.
