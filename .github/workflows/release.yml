name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write
  packages: write

jobs:
  # Create GitHub release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Get version from tag
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
        else
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.get_version.outputs.version }}
        release_name: Release ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
        body: |
          ## Thermos-Rust ${{ steps.get_version.outputs.version }}

          Multi-zone HomeKit thermostat system for Raspberry Pi.

          ### Installation

          Download the appropriate binary for your Raspberry Pi model:
          - **Raspberry Pi 2/3/4 (32-bit)**: `thermos-rust-armv7-unknown-linux-gnueabihf`
          - **Raspberry Pi 3/4 (64-bit)**: `thermos-rust-aarch64-unknown-linux-gnu`
          - **x86_64 Linux**: `thermos-rust-x86_64-unknown-linux-gnu`

          ### Quick Start

          ```bash
          # Download binary (replace URL with actual asset URL)
          wget https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.version }}/thermos-rust-armv7-unknown-linux-gnueabihf

          # Make executable
          chmod +x thermos-rust-armv7-unknown-linux-gnueabihf

          # Move to system path
          sudo mv thermos-rust-armv7-unknown-linux-gnueabihf /usr/local/bin/thermos-rust

          # Run
          thermos-rust --config /path/to/config.json
          ```

          ### Changes

          See [CHANGELOG.md](CHANGELOG.md) for details.

  # Build binaries for different Linux targets using cross-compilation
  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Raspberry Pi 2/3/4 (32-bit)
          - target: armv7-unknown-linux-gnueabihf
            cross: true

          # Raspberry Pi 3/4 (64-bit)
          - target: aarch64-unknown-linux-gnu
            cross: true

          # x86_64 Linux (for testing/development)
          - target: x86_64-unknown-linux-gnu
            cross: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross-compilation tools
      if: matrix.cross
      run: |
        cargo install cross --git https://github.com/cross-rs/cross

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ matrix.target }}-cargo-git-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release binary (cross)
      if: matrix.cross
      run: cross build --release --target ${{ matrix.target }}

    - name: Build release binary (native)
      if: "!matrix.cross"
      run: cargo build --release --target ${{ matrix.target }}

    - name: Strip binary
      run: |
        strip target/${{ matrix.target }}/release/thermos-rust || true

    - name: Create archive
      run: |
        cd target/${{ matrix.target }}/release
        tar czf thermos-rust-${{ matrix.target }}.tar.gz thermos-rust
        sha256sum thermos-rust-${{ matrix.target }}.tar.gz > thermos-rust-${{ matrix.target }}.tar.gz.sha256

    - name: Upload binary to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./target/${{ matrix.target }}/release/thermos-rust-${{ matrix.target }}.tar.gz
        asset_name: thermos-rust-${{ matrix.target }}.tar.gz
        asset_content_type: application/gzip

    - name: Upload checksum to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ needs.create-release.outputs.upload_url }}
        asset_path: ./target/${{ matrix.target }}/release/thermos-rust-${{ matrix.target }}.tar.gz.sha256
        asset_name: thermos-rust-${{ matrix.target }}.tar.gz.sha256
        asset_content_type: text/plain

