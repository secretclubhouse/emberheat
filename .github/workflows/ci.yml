name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Run tests on Debian Trixie
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y curl build-essential pkg-config libssl-dev git

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: debian-trixie-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          debian-trixie-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: debian-trixie-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          debian-trixie-cargo-git-

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: debian-trixie-${{ matrix.rust }}-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          debian-trixie-${{ matrix.rust }}-target-

    - name: Check formatting
      run: cargo fmt -- --check
      if: matrix.rust == 'stable'

    - name: Run Clippy
      #run: cargo clippy -- -D warnings
      run: cargo clippy
      if: matrix.rust == 'stable'

    - name: Build
      run: cargo build --verbose

    - name: Run mock tests
      run: make test-mock

    - name: Run all tests
      run: make test-all

  # Security audit
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security audit
      uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # Code coverage
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y curl build-essential pkg-config libssl-dev git

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Install cargo-tarpaulin
      run: cargo install cargo-tarpaulin

    - name: Generate coverage
      run: cargo tarpaulin --out Xml --all-features

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./cobertura.xml
        fail_ci_if_error: false
