name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Format and lint checks - runs first to fail fast
  fmt-and-clippy:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: fmt-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          fmt-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: fmt-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          fmt-cargo-git-

    - name: Check formatting
      run: cargo fmt -- --check

    - name: Run Clippy
      run: cargo clippy -- -D warnings

  # Run tests on Debian Trixie
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: fmt-and-clippy
    container:
      image: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, nightly]

    steps:
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y curl build-essential pkg-config libssl-dev git

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: debian-trixie-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          debian-trixie-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: debian-trixie-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          debian-trixie-cargo-git-

    - name: Cache build artifacts
      uses: actions/cache@v4
      with:
        path: target
        key: debian-trixie-${{ matrix.rust }}-target-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          debian-trixie-${{ matrix.rust }}-target-

    - name: Build
      run: cargo build --verbose

    - name: Run mock tests
      run: make test-mock

    - name: Run all tests
      run: make test-all

  # Security audit
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security audit
      uses: rustsec/audit-check@v1.4.1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

  # Code coverage using llvm-cov (more reliable than tarpaulin)
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: fmt-and-clippy
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: coverage-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          coverage-cargo-registry-

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: coverage-cargo-git-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          coverage-cargo-git-

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Generate coverage
      run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: lcov.info
        fail_ci_if_error: false
