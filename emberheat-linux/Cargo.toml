[package]
name = "emberheat-linux"
version = "0.1.0"
edition = "2021"
authors = ["Josh Tambunga"]
description = "Multi-zone thermostat system for Raspberry Pi/Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/secretclubhouse/emberheat"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(matter_enabled)'] }

[dependencies]
# Core thermostat logic (platform-agnostic)
emberheat-core = { path = "../emberheat-core", features = ["std"] }

# Tokio - kept for redis/reqwest compatibility
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "sync", "time", "net", "io-util", "fs", "macros", "signal"] }
futures = { workspace = true }

# Async trait support
async-trait = { workspace = true }

# Lazy static for global metrics
lazy_static = "1.5"

# Configuration and serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"

# Redis client
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }

# Prometheus metrics
prometheus = { version = "0.14", features = ["process"] }

# HTTP client for extra sensors
# Using rustls-tls instead of default openssl for easier cross-compilation
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Logging
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Signal handling
tokio-util = "0.7"
signal-hook = "0.3"
signal-hook-tokio = { version = "0.3", features = ["futures-v0_3"] }

# Time utilities
chrono = { workspace = true, features = ["serde"] }

# QR code generation for Matter commissioning
qrcode = "0.14"
heapless = "0.9.2"

# Platform-specific dependencies (Linux only)
[target.'cfg(target_os = "linux")'.dependencies]
rppal = "0.22"  # Raspberry Pi GPIO library

[build-dependencies]
# Minimal build dependencies (Matter integration removed)

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
tempfile = "3.14"
pretty_assertions = "1.4"
serial_test = "3.2"

[features]
default = []
# Matter integration is currently disabled
# See MATTER_INTEGRATION.md for re-integration instructions

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
