# Prometheus configuration for Thermos-Rust

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'thermostat-monitor'

# Alerting configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Load rules once and periodically evaluate them
rule_files:
  # - "alerts.yml"

# Scrape configurations
scrape_configs:
  # Thermostat application metrics
  - job_name: 'thermostat'
    static_configs:
      - targets: ['localhost:8080']
        labels:
          service: 'thermostat'
          instance: 'raspberry-pi'

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Node exporter (if installed)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'node-exporter'
