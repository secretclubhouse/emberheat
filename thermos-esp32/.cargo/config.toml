# ESP32-C6 build configuration for thermos-esp32
#
# This configuration ensures proper linking with esp-hal's linker scripts
# and builds the standard library for the RISC-V target.

[build]
target = "riscv32imac-unknown-none-elf"

[target.'cfg(target_arch = "riscv32")']
runner = "espflash flash --monitor"
rustflags = [
  # Link with esp-hal's linker scripts
  "-C", "link-arg=-Tlinkall.x",
  # Enable frame pointers for better backtraces
  "-C", "force-frame-pointers",
]

[env]
ESP_LOG = "info"

[unstable]
# Build core and alloc for the bare-metal target
build-std = ["alloc", "core"]
