[package]
name = "thermos-esp32"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
# Platform-agnostic core library (without embassy - esp-rtos provides it)
thermos-core = { path = "../thermos-core", default-features = false }

# Matter thermostat cluster implementation
thermos-matter = { path = "../thermos-matter" }

# ESP32-C6 HAL and platform support (with unstable feature for esp-radio)
# Note: Feature order matters - chip features must be consistent across all esp-* crates
esp-hal = { version = "1.0", features = ["esp32c6", "unstable", "log-04"] }
esp-rtos = { version = "0.2", features = ["esp32c6", "embassy", "esp-radio", "esp-alloc", "log-04"] }
esp-backtrace = { version = "0.18", features = ["esp32c6", "panic-handler", "println"] }
esp-println = { version = "0.16", features = ["esp32c6", "log-04"] }
esp-alloc = { version = "0.9" }
esp-storage = { version = "0.8", features = ["esp32c6"] }

# ESP-IDF bootloader provides linker scripts and boot sequence
esp-bootloader-esp-idf = { version = "0.4", features = ["esp32c6"] }

# Embassy dependencies (must match esp-rtos versions)
embassy-executor = "0.9"
embassy-futures = "0.1"
embassy-sync = "0.7"
embassy-time = "0.5"

# Embedded HAL traits
embedded-hal = "1.0"
embedded-hal-async = "1.0"

# I2C sensor driver (BME280)
bme280 = { version = "0.5", default-features = false }

# Embedded storage traits
embedded-storage = "0.3"

# WiFi and networking (esp-radio replaces esp-wifi)
# unstable feature required for BLE commissioning via rs-matter-embassy
esp-radio = { version = "0.17", features = ["esp32c6", "wifi", "ble", "unstable", "log-04"] }
embassy-net = { version = "0.7", features = ["tcp", "udp", "dns", "dhcpv4", "medium-ethernet"] }
embedded-io-async = "0.6"

# MQTT client (no_std compatible)
rust-mqtt = { version = "0.3", default-features = false }

# Matter protocol support via rs-matter-embassy
# Using sysgrok forks which have been updated for Embassy 0.5+ compatibility
# embassy-net feature enables WiFi networking, esp feature enables ESP32 drivers
rs-matter-embassy = { git = "https://github.com/sysgrok/rs-matter-embassy", features = ["esp", "embassy-net", "log"] }

# 1-Wire DS18B20 temperature sensor (using RMT peripheral)
# Note: esp-hal-rmt-onewire 0.4 has compatibility issues with esp-hal 1.0
# Enable via `onewire-rmt` feature when dependency is updated
esp-hal-rmt-onewire = { version = "0.4", optional = true }

# Utilities
log = { workspace = true }
heapless = "0.9"
static_cell = "2.1"
fugit = "0.3"
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = { version = "0.6", default-features = false }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "macros", "sync", "time"] }

[features]
default = []
# Enable RMT-based 1-Wire implementation (requires compatible esp-hal-rmt-onewire)
onewire-rmt = ["dep:esp-hal-rmt-onewire"]

[profile.dev]
opt-level = "z"
lto = "fat"

# esp-radio requires optimization level 2 or 3 for proper connectivity
[profile.dev.package.esp-radio]
opt-level = 3

[[bin]]
name = "scan_sensors"
path = "src/bin/scan_sensors.rs"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
