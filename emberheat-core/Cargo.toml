[package]
name = "emberheat-core"
version = "0.1.0"
edition = "2021"
authors = ["Josh Tambunga"]
description = "Platform-agnostic thermostat control logic"
license = "MIT OR Apache-2.0"

[dependencies]
# Serialization (no_std compatible)
serde = { workspace = true, default-features = false, features = ["derive"] }

# Error handling (no_std compatible)
# Note: thiserror and anyhow require std, so we use custom error types for no_std
thiserror = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }

# Logging (optional for no_std)
tracing = { workspace = true, optional = true }

# Async trait support
async-trait = { workspace = true }

# Time utilities (optional for platforms with std)
chrono = { workspace = true, features = ["serde"], optional = true }

# no_std data structures
heapless = { version = "0.9", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["rt", "macros", "sync"] }
serde_json = "1.0"

[features]
default = ["std"]
std = ["serde/std", "serde/default", "tracing", "thiserror", "anyhow", "chrono"]
